name: Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  pytest:
    # Tkinter needs a real desktop session (BackgroundWindow instantiates
    # tkinter Variables even with show=False); windows-latest runners have
    # one, unlike headless Linux runners.
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=all -r requirements.txt --timeout 600
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          cd code
          pytest -v
