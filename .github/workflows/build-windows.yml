name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE with PyInstaller
        run: |
          cd code
          pyinstaller \
          --onefile \
          --noconsole \
          --add-data "data:data" \
          --name "STIX Solor Orbiter" \
          --paths=src \
          --hidden-import matplotlib.backends.backend_tkagg \
          src/main.py
            
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
  
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Linux binary
        run: |
          cd code
          pyinstaller \
          --onefile \
          --noconsole \
          --add-data "data:data" \
          --name "STIX Solor Orbiter" \
          --paths=src \
          --hidden-import matplotlib.backends.backend_tkagg \
          src/main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*
          
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS APP
        run: |
          cd code
          pyinstaller \
            --windowed \
            --noconsole \
            --name "STIX Solor Orbiter" \
            --paths=src \
            --add-data "data:data" \
            --hidden-import matplotlib.backends.backend_tkagg \
            src/main.py

      - name: Create DMG
        run: |
          mkdir dmg
          cp -R dist/main.app dmg/
          hdiutil create \
            -volname "main" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            dist/main.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/main.dmg


