name: Build EXE Multi-OS
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # ← Pour tes paquets astro lourds
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip  # ← Évite de tout retélécharger
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.pythonLocation }}/lib/python3.11/site-packages
          ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary=all -r requirements.txt --timeout 600
        pip install pyinstaller

    - name: Build binary with PyInstaller
      run: |
        cd code
        pyinstaller \
          --onefile \
          --windowed \
          --noconsole \
          ${{ runner.os == 'Windows' && '--add-data "data;data"' || '--add-data "data:data"' }} \
          --name "STIX-Solar-Orbiter" \
          --paths=src \
          --hidden-import matplotlib.backends.backend_tkagg \
          src/main.py

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-binary
        path: dist/*
